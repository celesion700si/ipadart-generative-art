<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Breathing Orbit — 呼吸軌道</title>
  <script src="https://cdn.jsdelivr.net/npm/two.js@latest/build/two.min.js"></script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0a0a0d;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans TC", sans-serif;
    }

    #artwork {
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    #artwork svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .title {
      position: fixed;
      top: 28px;
      left: 32px;
      z-index: 10;
      color: rgba(255, 255, 255, 0.92);
      pointer-events: none;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(18px, 2.4vw, 32px);
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .title p {
      margin: 8px 0 0;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      letter-spacing: 0.12em;
    }

    .hint {
      position: fixed;
      right: 28px;
      bottom: 24px;
      z-index: 10;
      color: rgba(255, 255, 255, 0.42);
      font-size: 12px;
      letter-spacing: 0.08em;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="title">
    <h1>Breathing Orbit</h1>
    <p>呼吸軌道 · TWO.JS STUDY 001</p>
  </div>

  <div id="artwork"></div>

  <div class="hint">移動滑鼠或手指，改變軌道方向</div>

  <script>
    const container = document.getElementById("artwork");

    const two = new Two({
      type: Two.Types.svg,
      fullscreen: true,
      autostart: true
    }).appendTo(container);

    const orbitGroup = two.makeGroup();
    const rings = [];
    const satellites = [];

    const ringCount = 12;
    const satelliteCount = 18;

    let pointerX = 0;
    let pointerY = 0;
    let targetX = 0;
    let targetY = 0;

    function createRings() {
      for (let i = 0; i < ringCount; i++) {
        const radius = 38 + i * 23;
        const ring = two.makeCircle(0, 0, radius);
        ring.noFill();
        ring.stroke = `rgba(190, 205, 255, ${0.42 - i * 0.022})`;
        ring.linewidth = i % 3 === 0 ? 1.6 : 0.75;
        orbitGroup.add(ring);
        rings.push(ring);
      }
    }

    function createSatellites() {
      for (let i = 0; i < satelliteCount; i++) {
        const size = 2.5 + Math.random() * 5;
        const dot = two.makeCircle(0, 0, size);
        dot.noStroke();
        dot.fill = i % 3 === 0
          ? "rgba(255, 216, 165, 0.95)"
          : "rgba(190, 210, 255, 0.82)";
        dot.orbitRadius = 55 + Math.random() * 245;
        dot.speed = 0.002 + Math.random() * 0.006;
        dot.phase = Math.random() * Math.PI * 2;
        dot.depth = 0.45 + Math.random() * 0.55;
        orbitGroup.add(dot);
        satellites.push(dot);
      }
    }

    const coreOuter = two.makeCircle(0, 0, 24);
    coreOuter.noFill();
    coreOuter.stroke = "rgba(255, 236, 210, 0.8)";
    coreOuter.linewidth = 1.5;

    const coreInner = two.makeCircle(0, 0, 6);
    coreInner.noStroke();
    coreInner.fill = "rgba(255, 242, 220, 1)";

    orbitGroup.add(coreOuter, coreInner);

    createRings();
    createSatellites();

    function positionScene() {
      orbitGroup.translation.set(two.width / 2, two.height / 2);
      const responsiveScale = Math.min(two.width / 850, two.height / 850, 1.35);
      orbitGroup.scale = Math.max(0.58, responsiveScale);
    }

    positionScene();

    function updatePointer(clientX, clientY) {
      targetX = clientX / window.innerWidth - 0.5;
      targetY = clientY / window.innerHeight - 0.5;
    }

    window.addEventListener("pointermove", (event) => {
      updatePointer(event.clientX, event.clientY);
    });

    window.addEventListener("pointerdown", (event) => {
      updatePointer(event.clientX, event.clientY);
    });

    window.addEventListener("resize", positionScene);

    two.bind("update", (frameCount) => {
      const time = frameCount * 0.016;

      pointerX += (targetX - pointerX) * 0.045;
      pointerY += (targetY - pointerY) * 0.045;

      orbitGroup.rotation += 0.0008 + pointerX * 0.0015;

      rings.forEach((ring, index) => {
        const breathing = 1 + Math.sin(time * 0.85 + index * 0.48) * (0.012 + index * 0.0008);
        ring.scale = breathing;
        ring.rotation = Math.sin(time * 0.22 + index * 0.32) * 0.05 * pointerX;
      });

      satellites.forEach((dot, index) => {
        const angle = dot.phase + frameCount * dot.speed * (index % 2 === 0 ? 1 : -1);
        const horizontalPull = 1 + pointerX * 0.5;
        const verticalPull = 0.72 + pointerY * 0.35;

        dot.translation.x = Math.cos(angle) * dot.orbitRadius * horizontalPull;
        dot.translation.y = Math.sin(angle) * dot.orbitRadius * verticalPull;

        const pulse = 0.75 + Math.sin(time * 1.4 + dot.phase) * 0.3;
        dot.scale = pulse * dot.depth;
        dot.opacity = 0.45 + pulse * 0.42;
      });

      const corePulse = 1 + Math.sin(time * 1.15) * 0.16;
      coreOuter.scale = corePulse;
      coreInner.scale = 0.9 + Math.sin(time * 1.15) * 0.12;
    });
  </script>
</body>
</html>
