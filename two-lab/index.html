<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="《Elastic Orbit｜失衡軌道》是林英斌以 Two.js 創作的互動研究；靠近、牽引與拖曳，讓環形結構回應觀看者的力量。">
  <meta name="author" content="Ying-Pin Lin">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://lab.ipadart.net/two-lab/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:site_name" content="iPadART Interactive Lab">
  <meta property="og:title" content="Elastic Orbit｜失衡軌道">
  <meta property="og:description" content="靠近、牽引與拖曳，使原本穩定的環形結構產生偏移；失衡不是故障，而是觀看留下的力量。">
  <meta property="og:url" content="https://lab.ipadart.net/two-lab/">
  <meta name="twitter:card" content="summary">
  <title>Elastic Orbit｜失衡軌道｜iPadART Interactive Lab</title>
  <script src="https://cdn.jsdelivr.net/npm/two.js@latest/build/two.min.js"></script>
  <style>
    :root {
      --eraser: #F9F9F9;
      --eraser-2: #E6E5E4;
      --navy: #252A4D;
      --teal-1: #45BFDB;
      --teal-2: #6DD9F2;
      --teal-3: #99ECFF;
      --matcha: #DEF089;
      --bubblegum: #FAB5E3;
      --ink-2: #2C3033;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 70% 42%, rgba(109, 217, 242, 0.18), transparent 31%),
        radial-gradient(circle at 27% 75%, rgba(227, 211, 245, 0.26), transparent 28%),
        var(--eraser);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans TC", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.28;
      background-image:
        linear-gradient(rgba(37, 42, 77, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37, 42, 77, 0.045) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(circle at 56% 52%, black, transparent 76%);
    }

    #artwork {
      position: fixed;
      inset: 0;
      touch-action: none;
      cursor: grab;
    }

    body.dragging #artwork { cursor: grabbing; }

    #artwork svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .caption {
      position: fixed;
      top: 32px;
      left: 36px;
      z-index: 5;
      pointer-events: none;
      transition: opacity 500ms ease, transform 500ms ease;
    }

    .caption h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(20px, 2.2vw, 32px);
      font-weight: 650;
      letter-spacing: -0.025em;
    }

    .caption p {
      margin: 7px 0 0;
      color: rgba(37, 42, 77, 0.52);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
    }

    .hint {
      position: fixed;
      right: 30px;
      bottom: 26px;
      z-index: 5;
      color: rgba(37, 42, 77, 0.48);
      font-size: 12px;
      font-weight: 560;
      pointer-events: none;
      transition: opacity 450ms ease;
    }

    body.engaged .caption {
      opacity: 0.28;
      transform: translateY(-3px);
    }

    body.engaged .hint { opacity: 0.12; }
  </style>
</head>
<body>
  <div class="caption">
    <h1>Elastic Orbit</h1>
    <p>失衡軌道 · TWO.JS STUDY 001</p>
  </div>

  <div id="artwork"></div>
  <div class="hint">靠近可牽引 · 按住拖曳可拉開結構</div>

  <script>
    const container = document.getElementById("artwork");

    const two = new Two({
      type: Two.Types.svg,
      fullscreen: true,
      autostart: true
    }).appendTo(container);

    const COLORS = {
      navy: "#252A4D",
      teal1: "#45BFDB",
      teal2: "#6DD9F2",
      teal3: "#99ECFF",
      matcha: "#DEF089",
      bubblegum: "#FAB5E3",
      eraser2: "#E6E5E4"
    };

    const FIELD = {
      x: 0, y: 0,
      tx: 0, ty: 0,
      vx: 0, vy: 0,
      inside: false,
      pressed: false,
      energy: 0,
      speed: 0
    };

    const scene = two.makeGroup();
    const membranes = [];
    const nodes = [];
    const vertexCount = 84;
    const membraneCount = 10;

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    function makeMembrane(index) {
      const vertices = [];
      const radius = 54 + index * 30;
      const phase = index * 0.73 + Math.random() * 0.4;

      for (let i = 0; i < vertexCount; i++) {
        const a = (i / vertexCount) * Math.PI * 2;
        const drift =
          Math.sin(a * 2 + phase) * (2.5 + index * 0.34) +
          Math.sin(a * 5 - phase) * (1.2 + index * 0.18);

        const homeX = Math.cos(a) * (radius + drift);
        const homeY = Math.sin(a) * (radius * 0.72 + drift * 0.8);
        const anchor = new Two.Anchor(homeX, homeY);

        anchor.homeX = homeX;
        anchor.homeY = homeY;
        anchor.vx = 0;
        anchor.vy = 0;
        anchor.strain = 0;
        vertices.push(anchor);
      }

      const path = two.makePath(vertices, true, false, true);
      path.noFill();
      path.stroke = index === 0
        ? COLORS.navy
        : index < 4
          ? COLORS.teal1
          : index < 8
            ? COLORS.teal2
            : COLORS.teal3;
      path.opacity = index === 0 ? 0.88 : 0.54 - index * 0.026;
      path.linewidth = index === 0 ? 2.2 : index % 3 === 0 ? 1.55 : 1.05;
      path.cap = "round";
      path.join = "round";
      path.translation.set(index * 7 - 30, index * -4 + 20);
      path.rotation = (index - membraneCount / 2) * 0.014;

      scene.add(path);
      membranes.push({ path, vertices, radius, phase, index });
    }

    function makeNode(index) {
      const node = two.makeCircle(0, 0, index % 4 === 0 ? 3.1 : 2.05);
      node.noStroke();
      node.fill = index % 7 === 0 ? COLORS.bubblegum : COLORS.matcha;
      node.opacity = 0;
      node.scale = 0.4;
      scene.add(node);
      nodes.push(node);
    }

    for (let i = 0; i < membraneCount; i++) makeMembrane(i);
    for (let i = 0; i < 30; i++) makeNode(i);

    const fieldHalo = two.makeCircle(0, 0, 44);
    fieldHalo.noFill();
    fieldHalo.stroke = COLORS.teal1;
    fieldHalo.linewidth = 1.4;
    fieldHalo.opacity = 0;
    scene.add(fieldHalo);

    const fieldCore = two.makeCircle(0, 0, 6.5);
    fieldCore.noStroke();
    fieldCore.fill = COLORS.navy;
    fieldCore.opacity = 0;
    scene.add(fieldCore);

    function resizeScene() {
      scene.translation.set(two.width * 0.56, two.height * 0.54);
      const scale = Math.min(two.width / 1060, two.height / 810);
      scene.scale = clamp(scale, 0.58, 1.3);
    }

    function localPointer(clientX, clientY) {
      const scale = typeof scene.scale === "number" ? scene.scale : scene.scale.x;
      return {
        x: (clientX - scene.translation.x) / scale,
        y: (clientY - scene.translation.y) / scale
      };
    }

    function setPointer(clientX, clientY) {
      const p = localPointer(clientX, clientY);
      FIELD.tx = p.x;
      FIELD.ty = p.y;
      FIELD.inside = true;
      document.body.classList.add("engaged");
    }

    window.addEventListener("pointermove", (event) => {
      setPointer(event.clientX, event.clientY);
    });

    window.addEventListener("pointerdown", (event) => {
      setPointer(event.clientX, event.clientY);
      FIELD.pressed = true;
      FIELD.energy = Math.min(2.4, FIELD.energy + 1.1);
      document.body.classList.add("dragging");
    });

    window.addEventListener("pointerup", () => {
      FIELD.pressed = false;
      document.body.classList.remove("dragging");
    });

    window.addEventListener("pointerleave", () => {
      FIELD.inside = false;
      FIELD.pressed = false;
      document.body.classList.remove("engaged", "dragging");
    });

    window.addEventListener("resize", resizeScene);
    resizeScene();

    two.bind("update", (frameCount) => {
      const time = frameCount * 0.016;

      const oldX = FIELD.x;
      const oldY = FIELD.y;
      const pointerSpring = FIELD.pressed ? 0.19 : 0.105;
      FIELD.vx += (FIELD.tx - FIELD.x) * pointerSpring;
      FIELD.vy += (FIELD.ty - FIELD.y) * pointerSpring;
      FIELD.vx *= FIELD.pressed ? 0.62 : 0.72;
      FIELD.vy *= FIELD.pressed ? 0.62 : 0.72;
      FIELD.x += FIELD.vx;
      FIELD.y += FIELD.vy;
      FIELD.speed = Math.hypot(FIELD.x - oldX, FIELD.y - oldY);
      FIELD.energy *= FIELD.pressed ? 0.992 : 0.955;

      const activeStrength = FIELD.inside ? (FIELD.pressed ? 1.95 : 0.92) : 0;
      let nodeCursor = 0;

      membranes.forEach((membrane) => {
        const layer = membrane.index / (membraneCount - 1);
        const stiffness = 0.052 - layer * 0.038;
        const damping = 0.69 + layer * 0.245;
        const pullRadius = 215 + membrane.index * 9 + FIELD.energy * 34;
        const maxPull = (FIELD.pressed ? 132 : 68) * (1 - layer * 0.28);

        let strongestVertex = null;
        let strongestInfluence = 0;

        membrane.vertices.forEach((vertex, i) => {
          const angle = (i / vertexCount) * Math.PI * 2;
          const idle =
            Math.sin(time * 0.44 + i * 0.18 + membrane.phase) * (1.3 + membrane.index * 0.3) +
            Math.sin(time * 0.13 - i * 0.07 + membrane.index) * 1.4;

          const dx = FIELD.x - vertex.x;
          const dy = FIELD.y - vertex.y;
          const dist = Math.max(1, Math.hypot(dx, dy));
          const influence = activeStrength * Math.pow(clamp(1 - dist / pullRadius, 0, 1), 1.45);

          if (influence > strongestInfluence) {
            strongestInfluence = influence;
            strongestVertex = vertex;
          }

          const directionalPull = influence * maxPull;
          const shear = influence * Math.sin(i * 0.26 + time * 1.1 - membrane.index * 0.55) * 28;
          const wake = influence * FIELD.speed * 1.8;

          const targetX =
            vertex.homeX +
            Math.cos(angle) * idle +
            (dx / dist) * directionalPull -
            (dy / dist) * shear -
            FIELD.vx * wake;

          const targetY =
            vertex.homeY +
            Math.sin(angle) * idle * 0.84 +
            (dy / dist) * directionalPull +
            (dx / dist) * shear -
            FIELD.vy * wake;

          vertex.vx += (targetX - vertex.x) * stiffness;
          vertex.vy += (targetY - vertex.y) * stiffness;
          vertex.vx *= damping;
          vertex.vy *= damping;
          vertex.x += vertex.vx;
          vertex.y += vertex.vy;

          vertex.strain = Math.hypot(vertex.x - vertex.homeX, vertex.y - vertex.homeY);
        });

        const strain = strongestVertex ? strongestVertex.strain : 0;
        membrane.path.linewidth =
          (membrane.index === 0 ? 2.2 : membrane.index % 3 === 0 ? 1.55 : 1.05) +
          clamp(strain / 90, 0, 1.4);

        membrane.path.rotation =
          Math.sin(time * 0.055 + membrane.phase) * 0.018 +
          FIELD.vx * 0.00065 * (membrane.index - 4.5);

        if (strongestVertex && strongestInfluence > 0.16 && nodeCursor < nodes.length) {
          const node = nodes[nodeCursor++];
          node.translation.set(
            strongestVertex.x + membrane.path.translation.x,
            strongestVertex.y + membrane.path.translation.y
          );
          node.opacity = clamp(strongestInfluence * 0.95, 0, 0.92);
          node.scale = 0.55 + clamp(strain / 58, 0, 1.8);
          node.fill = membrane.index % 3 === 0 ? COLORS.bubblegum : COLORS.matcha;
        }
      });

      nodes.forEach((node, index) => {
        if (index >= nodeCursor) {
          node.opacity *= 0.82;
          node.scale += (0.4 - node.scale) * 0.16;
        }
      });

      fieldHalo.translation.set(FIELD.x, FIELD.y);
      fieldCore.translation.set(FIELD.x, FIELD.y);
      fieldHalo.opacity += ((FIELD.inside ? 0.34 : 0) - fieldHalo.opacity) * 0.18;
      fieldCore.opacity += ((FIELD.inside ? 0.82 : 0) - fieldCore.opacity) * 0.2;
      fieldHalo.scale = 1 + FIELD.energy * 0.28 + Math.sin(time * 2.1) * 0.035;
      fieldCore.scale = FIELD.pressed ? 1.35 : 0.88 + FIELD.speed * 0.025;
      fieldCore.fill = FIELD.pressed ? COLORS.teal1 : COLORS.navy;

      scene.rotation = Math.sin(time * 0.035) * 0.01;
    });
  </script>
</body>
</html>
