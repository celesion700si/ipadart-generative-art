<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Elastic Orbit — 失衡軌道</title>
  <script src="https://cdn.jsdelivr.net/npm/two.js@latest/build/two.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 64% 46%, rgba(30, 36, 48, 0.34), transparent 36%),
        radial-gradient(circle at 24% 72%, rgba(43, 31, 37, 0.22), transparent 30%),
        #08090c;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans TC", sans-serif;
    }

    #artwork {
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    #artwork svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .caption {
      position: fixed;
      top: 30px;
      left: 34px;
      z-index: 5;
      pointer-events: none;
      transition: opacity 900ms ease;
    }

    .caption h1 {
      margin: 0;
      color: rgba(244, 241, 235, 0.88);
      font-size: clamp(18px, 2vw, 28px);
      font-weight: 520;
      letter-spacing: 0.035em;
    }

    .caption p {
      margin: 8px 0 0;
      color: rgba(212, 217, 228, 0.38);
      font-size: 11px;
      letter-spacing: 0.17em;
    }

    .hint {
      position: fixed;
      right: 28px;
      bottom: 24px;
      z-index: 5;
      color: rgba(225, 226, 232, 0.28);
      font-size: 11px;
      letter-spacing: 0.08em;
      pointer-events: none;
      transition: opacity 700ms ease;
    }

    body.engaged .caption,
    body.engaged .hint {
      opacity: 0.18;
    }
  </style>
</head>
<body>
  <div class="caption">
    <h1>Elastic Orbit</h1>
    <p>失衡軌道 · TWO.JS STUDY 001</p>
  </div>

  <div id="artwork"></div>
  <div class="hint">靠近、牽引，然後放手</div>

  <script>
    const container = document.getElementById("artwork");

    const two = new Two({
      type: Two.Types.svg,
      fullscreen: true,
      autostart: true
    }).appendTo(container);

    const FIELD = {
      x: 0,
      y: 0,
      tx: 0,
      ty: 0,
      vx: 0,
      vy: 0,
      active: false,
      energy: 0
    };

    const scene = two.makeGroup();
    const membranes = [];
    const motes = [];
    const vertexCount = 72;
    const membraneCount = 9;

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    function makeMembrane(index) {
      const vertices = [];
      const radius = 58 + index * 31;
      const phase = Math.random() * Math.PI * 2;

      for (let i = 0; i < vertexCount; i++) {
        const a = (i / vertexCount) * Math.PI * 2;
        const radialDrift =
          Math.sin(a * 2 + phase) * (2.2 + index * 0.32) +
          Math.sin(a * 5 - phase * 0.7) * (0.9 + index * 0.16);

        const homeX = Math.cos(a) * (radius + radialDrift);
        const homeY = Math.sin(a) * (radius * 0.78 + radialDrift * 0.65);

        const anchor = new Two.Anchor(homeX, homeY);
        anchor.homeX = homeX;
        anchor.homeY = homeY;
        anchor.vx = 0;
        anchor.vy = 0;
        anchor.seed = Math.random() * 100;
        vertices.push(anchor);
      }

      const path = two.makePath(vertices, true, false, true);
      path.noFill();
      path.stroke = index % 3 === 0
        ? `rgba(211, 218, 232, ${0.27 - index * 0.014})`
        : `rgba(151, 164, 187, ${0.19 - index * 0.010})`;
      path.linewidth = index % 3 === 0 ? 1.15 : 0.7;
      path.cap = "round";
      path.join = "round";

      path.translation.set(index * 7 - 28, index * -4 + 18);
      path.rotation = (index - membraneCount / 2) * 0.012;

      scene.add(path);
      membranes.push({ path, vertices, radius, phase, index });
    }

    function makeMote(index) {
      const mote = two.makeCircle(0, 0, index % 5 === 0 ? 2.2 : 1.15);
      mote.noStroke();
      mote.fill = index % 5 === 0
        ? "rgba(235, 194, 150, 0.78)"
        : "rgba(196, 207, 226, 0.48)";

      mote.angle = Math.random() * Math.PI * 2;
      mote.radius = 92 + Math.random() * 270;
      mote.speed = (Math.random() * 0.0007 + 0.00018) * (Math.random() > 0.5 ? 1 : -1);
      mote.offset = Math.random() * Math.PI * 2;
      mote.drag = 0.92 + Math.random() * 0.045;
      mote.vx = 0;
      mote.vy = 0;
      mote.depth = 0.45 + Math.random() * 0.9;

      scene.add(mote);
      motes.push(mote);
    }

    for (let i = 0; i < membraneCount; i++) makeMembrane(i);
    for (let i = 0; i < 34; i++) makeMote(i);

    const nucleus = two.makeCircle(0, 0, 3.2);
    nucleus.noStroke();
    nucleus.fill = "rgba(244, 226, 204, 0.84)";
    scene.add(nucleus);

    const halo = two.makeCircle(0, 0, 19);
    halo.noFill();
    halo.stroke = "rgba(235, 218, 199, 0.22)";
    halo.linewidth = 0.8;
    scene.add(halo);

    function resizeScene() {
      scene.translation.set(two.width * 0.54, two.height * 0.53);
      const scale = Math.min(two.width / 1050, two.height / 820);
      scene.scale = clamp(scale, 0.62, 1.25);
    }

    function localPointer(clientX, clientY) {
      const scale = typeof scene.scale === "number" ? scene.scale : scene.scale.x;
      return {
        x: (clientX - scene.translation.x) / scale,
        y: (clientY - scene.translation.y) / scale
      };
    }

    function setPointer(clientX, clientY, active = true) {
      const p = localPointer(clientX, clientY);
      FIELD.tx = p.x;
      FIELD.ty = p.y;
      FIELD.active = active;
      document.body.classList.toggle("engaged", active);
    }

    window.addEventListener("pointermove", (event) => {
      setPointer(event.clientX, event.clientY, true);
    });

    window.addEventListener("pointerdown", (event) => {
      setPointer(event.clientX, event.clientY, true);
      FIELD.energy = Math.min(1.8, FIELD.energy + 0.75);
    });

    window.addEventListener("pointerup", () => {
      FIELD.active = false;
      document.body.classList.remove("engaged");
    });

    window.addEventListener("pointerleave", () => {
      FIELD.active = false;
      document.body.classList.remove("engaged");
    });

    window.addEventListener("resize", resizeScene);
    resizeScene();

    two.bind("update", (frameCount) => {
      const time = frameCount * 0.014;

      const spring = FIELD.active ? 0.055 : 0.018;
      FIELD.vx += (FIELD.tx - FIELD.x) * spring;
      FIELD.vy += (FIELD.ty - FIELD.y) * spring;
      FIELD.vx *= FIELD.active ? 0.80 : 0.90;
      FIELD.vy *= FIELD.active ? 0.80 : 0.90;
      FIELD.x += FIELD.vx;
      FIELD.y += FIELD.vy;
      FIELD.energy *= 0.972;

      membranes.forEach((membrane) => {
        const layerDelay = membrane.index * 0.14;
        const stiffness = 0.0105 - membrane.index * 0.00048;
        const damping = 0.885 + membrane.index * 0.004;

        membrane.vertices.forEach((vertex, i) => {
          const wave =
            Math.sin(time * 0.62 + i * 0.21 + membrane.phase) * (1.2 + membrane.index * 0.22) +
            Math.sin(time * 0.19 - i * 0.09 + membrane.index) * 1.1;

          const angle = (i / vertexCount) * Math.PI * 2;
          const idleX = Math.cos(angle) * wave;
          const idleY = Math.sin(angle) * wave * 0.72;

          const dx = FIELD.x - vertex.x;
          const dy = FIELD.y - vertex.y;
          const dist = Math.max(1, Math.hypot(dx, dy));
          const radius = 155 + FIELD.energy * 70;
          const influence = FIELD.active
            ? Math.pow(clamp(1 - dist / radius, 0, 1), 2.2)
            : 0;

          const pull = influence * (18 + membrane.index * 2.4);
          const tangent = Math.sin(time * 0.7 + layerDelay + i * 0.17) * influence * 4.5;

          const targetX = vertex.homeX + idleX + (dx / dist) * pull - (dy / dist) * tangent;
          const targetY = vertex.homeY + idleY + (dy / dist) * pull + (dx / dist) * tangent;

          vertex.vx += (targetX - vertex.x) * stiffness;
          vertex.vy += (targetY - vertex.y) * stiffness;
          vertex.vx *= damping;
          vertex.vy *= damping;
          vertex.x += vertex.vx;
          vertex.y += vertex.vy;
        });

        membrane.path.rotation =
          Math.sin(time * 0.07 + membrane.phase) * 0.018 +
          FIELD.x * 0.000018 * (membrane.index - 3);
      });

      motes.forEach((mote, index) => {
        mote.angle += mote.speed * (1 + FIELD.energy * 0.9);

        const baseX = Math.cos(mote.angle + mote.offset) * mote.radius;
        const baseY = Math.sin(mote.angle + mote.offset) * mote.radius * 0.72;

        const dx = FIELD.x - mote.translation.x;
        const dy = FIELD.y - mote.translation.y;
        const dist = Math.max(1, Math.hypot(dx, dy));
        const influence = FIELD.active ? clamp(1 - dist / 190, 0, 1) : 0;

        mote.vx += (baseX - mote.translation.x) * 0.0038;
        mote.vy += (baseY - mote.translation.y) * 0.0038;
        mote.vx += (dx / dist) * influence * 0.16;
        mote.vy += (dy / dist) * influence * 0.16;
        mote.vx *= mote.drag;
        mote.vy *= mote.drag;

        mote.translation.x += mote.vx;
        mote.translation.y += mote.vy;
        mote.opacity = 0.14 + (Math.sin(time * 0.9 + index) + 1) * 0.14 + influence * 0.36;
        mote.scale = mote.depth * (0.7 + influence * 0.8);
      });

      const pulse = 1 + Math.sin(time * 0.55) * 0.10 + FIELD.energy * 0.08;
      halo.scale = pulse;
      halo.translation.set(FIELD.x * 0.035, FIELD.y * 0.035);
      nucleus.translation.set(FIELD.x * 0.012, FIELD.y * 0.012);
      nucleus.scale = 0.92 + Math.sin(time * 0.8) * 0.1;

      scene.rotation = Math.sin(time * 0.045) * 0.012;
    });
  </script>
</body>
</html>
