name: Validate CyberFair 2019 Offline Archive

on:
  workflow_dispatch:
  push:
    branches: [rescue-cyber2019-archive]
    paths: [.github/workflows/cyber2019-validate.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout rescue branch
        uses: actions/checkout@v4
        with:
          ref: rescue-cyber2019-archive
          fetch-depth: 0

      - name: Install parser
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4

      - name: Validate archive references without network
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, re
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, unquote
          from bs4 import BeautifulSoup

          HOST='cyber2019.rfjh.ntpc.edu.tw'
          ROOT=Path('rescue/raw')/HOST
          META=Path('rescue/metadata')
          BASE=f'https://{HOST}/'
          files={p.relative_to(ROOT).as_posix():p for p in ROOT.rglob('*') if p.is_file()}
          htmls=sorted(p for p in ROOT.rglob('*') if p.suffix.lower() in {'.htm','.html','.shtml'})
          csss=sorted(ROOT.rglob('*.css'))
          jss=sorted(ROOT.rglob('*.js'))

          ok=[]; missing_required=[]; external_links=[]; external_dependencies=[]; js_advisory=[]
          seen=set()

          def src_url(src): return urljoin(BASE, src.relative_to(ROOT).as_posix())

          def saved_candidates(u):
              path=unquote(u.path).lstrip('/')
              out=[path]
              if u.query:
                  h=hashlib.sha256(u.query.encode('utf-8','replace')).hexdigest()[:12]
                  p=Path(path)
                  qname=f'{p.stem}__q_{h}{p.suffix}' if p.suffix else f'{p.name}__q_{h}'
                  out.append((p.parent/qname).as_posix())
              if not path or path.endswith('/'):
                  out += [path+'index.html', path+'index.htm']
              return path, out

          def classify(raw, src, kind, dependency=True):
              if not isinstance(raw,str): return
              raw=raw.strip().replace('&amp;','&')
              if not raw or raw.startswith(('#','mailto:','tel:','javascript:','data:')): return
              key=(src.relative_to(ROOT).as_posix(),kind,raw)
              if key in seen:return
              seen.add(key)
              full=urljoin(src_url(src),raw); u=urlsplit(full)
              if u.scheme not in ('http','https'): return
              rec={'source':key[0],'kind':kind,'reference':raw,'resolved':full}
              if u.netloc.lower()!=HOST:
                  (external_dependencies if dependency else external_links).append(rec); return
              path,cands=saved_candidates(u)
              found=next((c for c in cands if c in files),None)
              rec['resolved_path']=path
              if found:
                  rec['found_as']=found; ok.append(rec)
              else:
                  missing_required.append(rec)

          css_url=re.compile(r"url\(\s*(['\"]?)(.*?)\1\s*\)",re.I)
          css_import=re.compile(r"@import\s+(?:url\()?\s*['\"]([^'\"]+)['\"]",re.I)

          for src in htmls:
              text=src.read_bytes().decode('utf-8',errors='replace')
              soup=BeautifulSoup(text,'html.parser')
              for tag in soup.find_all(True):
                  for attr in ('href','src','action','poster','data','background'):
                      v=tag.get(attr)
                      if not isinstance(v,str): continue
                      navigational=(tag.name=='a' and attr=='href')
                      classify(v,src,f'html:{tag.name}@{attr}',dependency=not navigational)
                  srcset=tag.get('srcset')
                  if isinstance(srcset,str):
                      for item in srcset.split(','):
                          bits=item.strip().split()
                          if bits: classify(bits[0],src,f'html:{tag.name}@srcset',dependency=True)
                  style=tag.get('style')
                  if isinstance(style,str):
                      for m in css_url.finditer(style): classify(m.group(2),src,'html:inline-style',True)
              for st in soup.find_all('style'):
                  for m in css_url.finditer(st.get_text(' ',strip=False)): classify(m.group(2),src,'html:style',True)

          for src in csss:
              text=src.read_bytes().decode('utf-8',errors='replace')
              for m in css_url.finditer(text): classify(m.group(2),src,'css:url',True)
              for m in css_import.finditer(text): classify(m.group(1),src,'css:import',True)

          # JS library strings are advisory only: they may be demos/fallbacks rather than runtime dependencies.
          ext_pat=r'(?:htm|html|css|js|jpg|jpeg|png|gif|svg|mp3|wav|m4a|mp4|m4v|mov|webm|pdf|woff2?|ttf|otf|eot|swf)'
          qref=re.compile(r"(?P<q>['\"])(?P<u>(?:https?://[^'\"]+|/[^'\"]+|(?:\.\.?/)?[^'\"]+)\."+ext_pat+r"(?:\?[^'\"]*)?)(?P=q)",re.I)
          for src in jss:
              text=src.read_bytes().decode('utf-8',errors='replace')
              for m in qref.finditer(text):
                  raw=m.group('u'); full=urljoin(src_url(src),raw); u=urlsplit(full)
                  if u.netloc.lower()!=HOST:
                      js_advisory.append({'source':src.relative_to(ROOT).as_posix(),'reference':raw,'resolved':full,'classification':'external-js-library-string'})
                  else:
                      path,cands=saved_candidates(u); found=next((c for c in cands if c in files),None)
                      if not found:
                          js_advisory.append({'source':src.relative_to(ROOT).as_posix(),'reference':raw,'resolved':full,'classification':'unresolved-js-library-string'})

          def uniq(rows,key='resolved'):
              out=[]; s=set()
              for r in rows:
                  k=(r.get(key),r.get('source'),r.get('kind'))
                  if k not in s:s.add(k);out.append(r)
              return out
          external_links=uniq(external_links)
          external_dependencies=uniq(external_dependencies)
          js_advisory=uniq(js_advisory)

          report={
            'archive_root':str(ROOT), 'total_files':len(files),
            'html_files':[p.relative_to(ROOT).as_posix() for p in htmls],
            'css_files':len(csss),'js_files':len(jss),
            'required_local_references_resolved':len(ok),
            'required_local_references_missing':len(missing_required),
            'external_navigational_links':len(external_links),
            'external_runtime_dependencies':len(external_dependencies),
            'js_library_advisories':len(js_advisory),
            'missing_required':missing_required,
            'external_links':external_links,
            'external_dependencies':external_dependencies,
            'js_advisory':js_advisory
          }
          (META/'OFFLINE_VALIDATION.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')

          md=['# CyberFair 2019 Offline Archive Validation','',
              f'- Files in primary archive: **{len(files)}**',
              f'- HTML pages: **{len(htmls)}**',
              f'- Required local references resolved: **{len(ok)}**',
              f'- Required local references missing: **{len(missing_required)}**',
              f'- External runtime dependencies from HTML/CSS: **{len(external_dependencies)}**',
              f'- External navigational links: **{len(external_links)}**',
              f'- JS library advisory strings: **{len(js_advisory)}**','',
              '## HTML pages']
          md += [f'- `{p.relative_to(ROOT).as_posix()}`' for p in htmls]
          md += ['','## Missing required local references']
          md += [f"- `{r['source']}` → `{r['reference']}` ({r['kind']})" for r in missing_required] or ['- None']
          md += ['','## External runtime dependencies']
          md += [f"- `{r['resolved']}` ← `{r['source']}` ({r['kind']})" for r in external_dependencies] or ['- None']
          md += ['','## External navigational links']
          md += [f"- `{r['resolved']}` ← `{r['source']}`" for r in external_links] or ['- None']
          md += ['','## JS library advisories (not counted as required page dependencies)']
          md += [f"- `{r['classification']}`: `{r['resolved']}` ← `{r['source']}`" for r in js_advisory] or ['- None']
          (META/'OFFLINE_VALIDATION.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if not isinstance(v,list)},ensure_ascii=False,indent=2))
          PY

      - name: Commit validation report
        shell: bash
        run: |
          git config user.name "CyberFair Preservation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add rescue/metadata/OFFLINE_VALIDATION.json rescue/metadata/OFFLINE_VALIDATION.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refine CyberFair 2019 offline integrity report'
            git push origin HEAD:rescue-cyber2019-archive
          fi
